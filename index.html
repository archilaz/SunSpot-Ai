<script>
  let userLat = null, userLng = null, userName = "You";
  let mainMap = null, favMap = null;
  let favorites = JSON.parse(localStorage.getItem('sunspotsFavorites') || '[]');

  const spotsDB = [
    {id:1, name:"Griffith Observatory", lat:34.1184, lng:-118.3003, city:"Los Angeles, USA", type:"Sunset", time:"19:35", img:"[images.unsplash.com](https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800)"},
    {id:2, name:"Santa Monica Pier", lat:34.0101, lng:-118.4961, city:"Los Angeles, USA", type:"Sunset", time:"19:30", img:"[images.unsplash.com](https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800)"},
    {id:11, name:"Eiffel Tower Champ de Mars", lat:48.8584, lng:2.2945, city:"Paris, France", type:"Sunset", time:"21:10", img:"[images.unsplash.com](https://images.unsplash.com/photo-1511739000-6b45c414fa49?w=800)"},
    {id:8, name:"Table Mountain Cableway Top", lat:-33.9629, lng:18.4098, city:"Cape Town, South Africa", type:"Sunset", time:"19:05", img:"[images.unsplash.com](https://images.unsplash.com/photo-1570549717489-3d1d4a0d4e4f?w=800)"},
    {id:12, name:"Victoria Peak Sky Terrace", lat:22.2764, lng:114.1581, city:"Hong Kong", type:"Sunset", time:"18:45", img:"[images.unsplash.com](https://images.unsplash.com/photo-1506351421178-63b52a2d2562?w=800)"},
    {id:20, name:"Dubai Desert Dune", lat:25.1972, lng:55.2744, city:"Dubai, UAE", type:"Sunset", time:"18:45", img:"[images.unsplash.com](https://images.unsplash.com/photo-1518687338977-a84d3086a934?w=800)"},
    {id:17, name:"Amalfi Coast Viewpoint", lat:40.6340, lng:14.6028, city:"Positano, Italy", type:"Sunset", time:"20:05", img:"[images.unsplash.com](https://images.unsplash.com/photo-1551918120-9739cba430c6?w=800)"},
    {id:18, name:"Rio de Janeiro Sugarloaf", lat:-22.9486, lng:-43.1564, city:"Rio de Janeiro, Brazil", type:"Sunset", time:"18:00", img:"[images.unsplash.com](https://images.unsplash.com/photo-1483729558449-99ef09a8c325?w=800)"}
  ];

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))).toFixed(1);
  }

  function initMap(id, lat, lng) {
    const map = L.map(id).setView([lat, lng], 10);
    L.tileLayer('[{s}.tile.openstreetmap.org](https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png)', { attribution: '' }).addTo(map);
    return map;
  }

  function renderSpots() {
    const filtered = spotsDB
      .filter(s => s.type === "Sunset")
      .map(s => ({...s, distance: parseFloat(haversine(userLat, userLng, s.lat, s.lng))}))
      .filter(s => s.distance <= 100)
      .sort((a,b) => a.distance - b.distance);

    const grid = document.getElementById('spots-grid');
    grid.innerHTML = '';

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="text-center py-16 text-zinc-400 text-lg">No sunset spots within 100 km.</div>`;
      return;
    }

    filtered.forEach(spot => {
      const isFav = favorites.some(f => f.id === spot.id);
      const cardHTML = `
        <div class="spot-card rounded-3xl overflow-hidden border border-white/10">
          <div class="relative h-80">
            <img src="${spot.img}" class="w-full h-full object-cover">
            <div class="absolute bottom-5 left-5 bg-black/70 px-5 py-1.5 rounded-3xl text-xs font-medium">${spot.distance} km away</div>
          </div>
          <div class="p-7">
            <div class="flex justify-between">
              <div>
                <h3 class="text-2xl font-semibold">${spot.name}</h3>
                <p class="text-zinc-400 text-sm mt-1">${spot.city}</p>
              </div>
              <div class="text-right">
                <div class="text-amber-400 text-xs tracking-widest">${spot.type}</div>
                <div class="text-3xl font-light text-amber-200">${spot.time}</div>
              </div>
            </div>
            <div class="mt-8 flex gap-3">
              <button onclick="getDirections(${spot.lat},${spot.lng});event.stopImmediatePropagation()"
                      class="flex-1 py-4 bg-white text-zinc-950 font-semibold rounded-2xl">🧭 Get Directions</button>
              <button onclick="toggleFavorite(${spot.id});event.stopImmediatePropagation()"
                      class="px-7 py-4 border border-white/30 rounded-2xl text-3xl ${isFav ? 'text-red-400' : 'text-white/40'}">❤️</button>
            </div>
          </div>
        </div>`;
      grid.innerHTML += cardHTML;
    });

    // Draw markers
    if (mainMap) {
      mainMap.eachLayer(layer => { if (layer instanceof L.Marker) mainMap.removeLayer(layer); });
      L.marker([userLat, userLng], {icon: L.divIcon({html:`<div style="background:#f59e0b;width:22px;height:22px;border-radius:50%;border:4px solid white;box-shadow:0 0 0 6px rgba(245,158,11,0.5);"></div>`})}).addTo(mainMap);
      filtered.forEach(s => {
        L.marker([s.lat, s.lng]).addTo(mainMap).bindPopup(`<b>${s.name}</b><br>${s.distance} km`);
      });
    }
  }

  function getDirections(lat, lng) {
    window.open(`[google.com](https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLng}&destination=${lat},${lng})`, '_blank');
  }

  function toggleFavorite(id) {
    const spot = spotsDB.find(s => s.id === id);
    const index = favorites.findIndex(f => f.id === id);
    if (index > -1) favorites.splice(index, 1);
    else favorites.push(spot);
    localStorage.setItem('sunspotsFavorites', JSON.stringify(favorites));
    renderSpots();
  }

  // 🟡 NEW — Automatically detect and render nearby sunset spots
  function autoDetectAndShow() {
    if (!navigator.geolocation) {
      alert("Geolocation not supported.");
      return;
    }
    navigator.geolocation.getCurrentPosition(pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      userName = "You";
      document.getElementById('results').classList.remove('hidden');
      document.getElementById('favorites').classList.add('hidden');
      document.getElementById('location-name').innerHTML = `Sunset spots near <span class="gradient-text">You</span>`;
      if (!mainMap) mainMap = initMap('main-map', userLat, userLng);
      else mainMap.flyTo([userLat, userLng], 10);
      renderSpots();
    }, () => alert("Please allow location access to find sunset spots nearby."));
  }

  window.onload = autoDetectAndShow;
</script>
