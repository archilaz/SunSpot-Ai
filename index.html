<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunspots AI • Real Golden Hour Near You</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    
    .hero-bg {
      background: linear-gradient(rgba(15,23,42,0.65), rgba(15,23,42,0.75)),
                  url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=2400&q=80') center/cover no-repeat;
      position: relative;
      overflow: hidden;
    }
    
    .hero-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.22) 0%, transparent 60%);
      animation: sparkle 15s infinite alternate;
    }
    
    @keyframes sparkle { 0% { opacity: 0.7; } 100% { opacity: 1; } }
    
    .sun-icon { animation: sun-glow 6s infinite alternate; }
    @keyframes sun-glow { 0% { filter: drop-shadow(0 0 25px #fed7aa); } 100% { filter: drop-shadow(0 0 55px #f59e0b); } }
    
    .spot-card {
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: #171717;
    }
    .spot-card:hover {
      transform: scale(1.06) translateY(-14px);
      box-shadow: 0 30px 70px -15px rgba(245, 158, 11, 0.45);
    }
    
    .map-container { height: 480px; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 60px -12px rgb(0 0 0 / 0.4); }
    
    .gradient-text {
      background: linear-gradient(to right, #fef08c, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-zinc-950 text-white">

  <!-- NAV -->
  <nav class="fixed top-0 z-50 w-full bg-black/40 backdrop-blur-2xl border-b border-white/10">
    <div class="max-w-7xl mx-auto px-8 py-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="text-5xl sun-icon">☀️</div>
        <div class="text-4xl font-bold tracking-tighter">
          <span class="gradient-text">Sunspots</span><span class="text-white">AI</span>
        </div>
      </div>
      <div class="flex items-center gap-9 text-sm font-medium">
        <a onclick="showResultsSection()" class="hover:text-amber-300 cursor-pointer">Near Me</a>
        <a onclick="showFavorites()" class="hover:text-amber-300 cursor-pointer">My Favorites</a>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <header class="hero-bg h-screen flex items-center justify-center text-center relative">
    <div class="absolute top-12 right-12 text-7xl sun-icon opacity-40">☀️</div>
    <div class="absolute bottom-32 left-20 text-6xl sun-icon opacity-30">☀️</div>

    <div class="relative z-10 max-w-4xl px-6">
      <h1 class="text-7xl md:text-8xl font-bold tracking-tighter leading-none mb-6 text-white">
        SUNSPOTS <span class="gradient-text">AI</span>
      </h1>
      <p class="text-3xl text-amber-100 font-light mb-12 max-w-xl mx-auto">
        Real sunset & sunrise spots within 100 km of you
      </p>
      
      <div class="max-w-xl mx-auto bg-white/10 backdrop-blur-3xl rounded-3xl p-2 flex items-center gap-3 shadow-2xl">
        <input id="city-input" type="text" placeholder="Enter city or address (e.g. Paris, Sydney...)" 
               class="flex-1 bg-transparent px-8 py-6 text-lg placeholder:text-amber-200 focus:outline-none">
        <button onclick="searchManualLocation()" 
                class="px-12 py-6 bg-white text-zinc-950 font-semibold rounded-3xl hover:bg-amber-400 transition-all text-base">
          FIND GOLDEN HOUR
        </button>
      </div>
      
      <button onclick="useMyLocation()" 
              class="mt-8 flex items-center gap-4 mx-auto text-amber-100 hover:text-white text-lg font-medium transition">
        <span class="text-4xl">📍</span>
        <span>Use my real location</span>
      </button>
    </div>
  </header>

  <!-- RESULTS -->
  <div id="results" class="hidden max-w-7xl mx-auto px-8 py-20">
    <div class="flex justify-between items-center mb-10">
      <div>
        <p class="text-amber-400 text-sm tracking-widest">ONLY WITHIN 100 KM • SAME CONTINENT</p>
        <h2 id="location-name" class="text-5xl font-bold tracking-tighter">Spots near You</h2>
      </div>
      <button onclick="hideResults()" class="text-sm text-zinc-400 hover:text-white">✕ Clear search</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
      <div class="lg:col-span-7">
        <div id="main-map" class="map-container"></div>
      </div>
      <div class="lg:col-span-5 space-y-8" id="spots-grid"></div>
    </div>
  </div>

  <!-- FAVORITES -->
  <div id="favorites" class="hidden max-w-7xl mx-auto px-8 py-20">
    <h2 class="text-5xl font-bold tracking-tighter mb-10 flex items-center gap-4">
      ❤️ My Saved Sunspots 
      <span id="fav-count" class="text-amber-400 text-3xl">(0)</span>
    </h2>
    <div id="fav-map" class="map-container mb-12"></div>
    <div id="fav-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
  </div>

  <script>
    let userLat = null, userLng = null, userName = "You";
    let mainMap = null, favMap = null;
    let favorites = JSON.parse(localStorage.getItem('sunspotsFavorites') || '[]');

    // ────────────────────────────────────────────────
    //   Much larger list — now many places worldwide
    // ────────────────────────────────────────────────
    const spotsDB = [
      {id:1,  name:"Griffith Observatory",           lat:34.1184,   lng:-118.3003,  city:"Los Angeles, USA",     type:"Sunset", time:"19:35", img:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800"},
      {id:2,  name:"Santa Monica Pier",              lat:34.0101,   lng:-118.4961,  city:"Los Angeles, USA",     type:"Sunset", time:"19:30", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"},
      {id:3,  name:"Oia Caldera View",               lat:36.4618,   lng:25.3750,    city:"Santorini, Greece",    type:"Sunset", time:"20:15", img:"https://images.unsplash.com/photo-1506929562872-bb421503ef9c?w=800"},
      {id:4,  name:"Moraine Lake Rockpile",          lat:51.3217,   lng:-116.1865,  city:"Banff, Canada",        type:"Sunrise",time:"06:05", img:"https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800"},
      {id:5,  name:"Uluru Sunset Viewing Area",      lat:-25.3444,  lng:131.0369,   city:"Uluru, Australia",     type:"Sunset", time:"18:45", img:"https://images.unsplash.com/photo-1540979388789-7cee28a1cdc9?w=800"},
      {id:6,  name:"Sydney Opera House Steps",       lat:-33.8568,  lng:151.2153,   city:"Sydney, Australia",    type:"Sunset", time:"19:40", img:"https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=800"},
      {id:7,  name:"Angkor Wat Sunrise Spot",        lat:13.4125,   lng:103.8667,   city:"Siem Reap, Cambodia",  type:"Sunrise",time:"05:50", img:"https://images.unsplash.com/photo-1504457047772-27faf1c00561?w=800"},
      {id:8,  name:"Table Mountain Cableway Top",    lat:-33.9629,  lng:18.4098,    city:"Cape Town, South Africa",type:"Sunset", time:"19:05", img:"https://images.unsplash.com/photo-1570549717489-3d1d4a0d4e4f?w=800"},
      {id:9,  name:"Mather Point",                   lat:36.0590,   lng:-112.1093,  city:"Grand Canyon, USA",    type:"Sunset", time:"19:15", img:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800"},
      {id:10, name:"Brooklyn Heights Promenade",     lat:40.7004,   lng:-73.9957,   city:"New York, USA",        type:"Sunset", time:"19:50", img:"https://images.unsplash.com/photo-1499092340477-7a0d3d5e8d2a?w=800"},
      {id:11, name:"Eiffel Tower Champ de Mars",     lat:48.8584,   lng:2.2945,     city:"Paris, France",        type:"Sunset", time:"21:10", img:"https://images.unsplash.com/photo-1511739000-6b45c414fa49?w=800"},
      {id:12, name:"Victoria Peak Sky Terrace",      lat:22.2764,   lng:114.1581,   city:"Hong Kong",            type:"Sunset", time:"18:45", img:"https://images.unsplash.com/photo-1506351421178-63b52a2d2562?w=800"},
      {id:13, name:"Marina Bay Sands Infinity Pool", lat:1.2833,    lng:103.8608,   city:"Singapore",            type:"Sunset", time:"19:10", img:"https://images.unsplash.com/photo-1506351421178-63b52a2d2562?w=800"},
      {id:14, name:"Haleakalā Summit",               lat:20.7097,   lng:-156.2520,  city:"Maui, Hawaii",         type:"Sunrise",time:"06:00", img:"https://images.unsplash.com/photo-1544197807-bb503430e22e?w=800"},
      {id:15, name:"Reykjavik Harbour",              lat:64.1466,   lng:-21.9426,   city:"Reykjavik, Iceland",   type:"Sunset", time:"22:50", img:"https://images.unsplash.com/photo-1476610182048-b07d0c0c8e8f?w=800"},
      {id:16, name:"Mount Fuji Lake Kawaguchi",      lat:35.4606,   lng:138.7646,   city:"Fujikawaguchiko, Japan",type:"Sunrise",time:"04:50", img:"https://images.unsplash.com/photo-1490806843957-31f2688d5d6e?w=800"},
      {id:17, name:"Amalfi Coast Viewpoint",         lat:40.6340,   lng:14.6028,    city:"Positano, Italy",      type:"Sunset", time:"20:05", img:"https://images.unsplash.com/photo-1551918120-9739cba430c6?w=800"},
      {id:18, name:"Rio de Janeiro Sugarloaf",       lat:-22.9486,  lng:-43.1564,   city:"Rio de Janeiro, Brazil",type:"Sunset", time:"18:00", img:"https://images.unsplash.com/photo-1483729558449-99ef09a8c325?w=800"},
      {id:19, name:"Machu Picchu Sun Gate",          lat:-13.1631,  lng:-72.5450,   city:"Cusco, Peru",          type:"Sunrise",time:"05:40", img:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800"},
      {id:20, name:"Dubai Desert Dune",              lat:25.1972,   lng:55.2744,    city:"Dubai, UAE",           type:"Sunset", time:"18:45", img:"https://images.unsplash.com/photo-1518687338977-a84d3086a934?w=800"},
      // ... you can continue adding more if needed
    ];

    // ────────────────────────────────────────────────
    //  The rest of the code remains EXACTLY THE SAME
    // ────────────────────────────────────────────────

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2-lat1)*Math.PI/180;
      const dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
    }

    function renderSpots() {
      const filtered = spotsDB.map(s => {
        const d = parseFloat(haversine(userLat, userLng, s.lat, s.lng));
        return {...s, distance: d};
      }).filter(s => s.distance <= 100)
        .sort((a,b) => a.distance - b.distance);

      const grid = document.getElementById('spots-grid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="text-center py-16 text-zinc-400 text-lg">No spots within 100 km.<br>Try searching a city closer to one of the known viewpoints.</div>`;
        return;
      }

      filtered.forEach(spot => {
        const isFav = favorites.some(f => f.id === spot.id);
        const cardHTML = `
          <div class="spot-card rounded-3xl overflow-hidden border border-white/10">
            <div class="relative h-80">
              <img src="${spot.img}" class="w-full h-full object-cover">
              <div class="absolute bottom-5 left-5 bg-black/70 px-5 py-1.5 rounded-3xl text-xs font-medium">${spot.distance} km away</div>
            </div>
            <div class="p-7">
              <div class="flex justify-between">
                <div>
                  <h3 class="text-2xl font-semibold">${spot.name}</h3>
                  <p class="text-zinc-400 text-sm mt-1">${spot.city}</p>
                </div>
                <div class="text-right">
                  <div class="text-amber-400 text-xs tracking-widest">${spot.type}</div>
                  <div class="text-3xl font-light text-amber-200">${spot.time}</div>
                </div>
              </div>
              <div class="mt-8 flex gap-3">
                <button onclick="getDirections(${spot.lat},${spot.lng});event.stopImmediatePropagation()" 
                        class="flex-1 py-4 bg-white text-zinc-950 font-semibold rounded-2xl">🧭 Get Directions</button>
                <button onclick="toggleFavorite(${spot.id});event.stopImmediatePropagation()" 
                        class="px-7 py-4 border border-white/30 rounded-2xl text-3xl ${isFav ? 'text-red-400' : 'text-white/40'}">❤️</button>
              </div>
            </div>
          </div>`;
        grid.innerHTML += cardHTML;
      });

      if (mainMap) {
        mainMap.eachLayer(layer => { if (layer instanceof L.Marker) mainMap.removeLayer(layer); });
        L.marker([userLat, userLng], {icon: L.divIcon({html: `<div style="background:#f59e0b;width:22px;height:22px;border-radius:50%;border:4px solid white;box-shadow:0 0 0 6px rgba(245,158,11,0.5);"></div>`, iconSize:[22,22]})}).addTo(mainMap);
        filtered.forEach(s => {
          L.marker([s.lat, s.lng]).addTo(mainMap).bindPopup(`<b>${s.name}</b><br>${s.distance} km`);
        });
      }
    }

    function toggleFavorite(id) {
      const spot = spotsDB.find(s => s.id === id);
      const index = favorites.findIndex(f => f.id === id);
      if (index > -1) favorites.splice(index, 1);
      else favorites.push(spot);
      localStorage.setItem('sunspotsFavorites', JSON.stringify(favorites));
      renderSpots();
      renderFavorites();
    }

    function getDirections(lat, lng) {
      window.open(`https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLng}&destination=${lat},${lng}`, '_blank');
    }

    function initMap(id, lat, lng) {
      const map = L.map(id).setView([lat, lng], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: ''}).addTo(map);
      return map;
    }

    async function searchManualLocation() {
      const input = document.getElementById('city-input').value.trim();
      if (!input) return alert("Please enter a city");
      
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(input)}&limit=1`);
      const data = await res.json();
      if (!data[0]) return alert("Location not found");
      
      userLat = parseFloat(data[0].lat);
      userLng = parseFloat(data[0].lng);
      userName = data[0].display_name.split(',')[0];
      
      document.getElementById('results').classList.remove('hidden');
      document.getElementById('favorites').classList.add('hidden');
      document.getElementById('location-name').innerHTML = `Spots near <span class="gradient-text">${userName}</span>`;
      
      if (!mainMap) mainMap = initMap('main-map', userLat, userLng);
      else mainMap.flyTo([userLat, userLng], 10);
      
      renderSpots();
    }

    function useMyLocation() {
      navigator.geolocation.getCurrentPosition(pos => {
        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;
        userName = "You";
        
        document.getElementById('results').classList.remove('hidden');
        document.getElementById('favorites').classList.add('hidden');
        document.getElementById('location-name').innerHTML = `Spots near <span class="gradient-text">You</span>`;
        
        if (!mainMap) mainMap = initMap('main-map', userLat, userLng);
        else mainMap.flyTo([userLat, userLng], 10);
        
        renderSpots();
      }, () => alert("Location access denied. Please type a city above."));
    }

    function renderFavorites() {
      document.getElementById('fav-count').textContent = `(${favorites.length})`;
      const grid = document.getElementById('fav-grid');
      grid.innerHTML = '';
      
      if (favorites.length === 0) {
        grid.innerHTML = `<p class="col-span-3 text-center text-zinc-400 py-12">No favorites yet.<br>Click ❤️ on any spot!</p>`;
        return;
      }
      
      favorites.forEach((spot, i) => {
        const card = document.createElement('div');
        card.className = "spot-card rounded-3xl overflow-hidden";
        card.innerHTML = `
          <div class="relative h-80">
            <img src="${spot.img}" class="w-full h-full object-cover">
          </div>
          <div class="p-7">
            <h3 class="text-2xl font-semibold">${spot.name}</h3>
            <p class="text-zinc-400">${spot.city}</p>
            <button onclick="removeFav(${i});event.stopImmediatePropagation()" class="mt-6 w-full py-4 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-2xl">Remove from favorites</button>
          </div>`;
        grid.appendChild(card);
      });
    }

    function removeFav(i) {
      favorites.splice(i, 1);
      localStorage.setItem('sunspotsFavorites', JSON.stringify(favorites));
      renderFavorites();
    }

    function showFavorites() {
      document.getElementById('results').classList.add('hidden');
      document.getElementById('favorites').classList.remove('hidden');
      if (!favMap) favMap = initMap('fav-map', userLat || 40.7, userLng || -74);
      renderFavorites();
    }

    function showResultsSection() {
      document.getElementById('results').classList.remove('hidden');
      document.getElementById('favorites').classList.add('hidden');
    }

    function hideResults() {
      document.getElementById('results').classList.add('hidden');
    }

    window.onload = () => {};
  </script>
</body>
</html>
