<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sunset Spots 🌅</title>
  
  <!-- More reliable Tailwind CDN fallback -->
  <script src="https://unpkg.com/tailwindcss-cdn@3.4.10/tailwindcss.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  
  <style>
    body { background: #09090b; color: white; }
    .gradient-text { background: linear-gradient(90deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="min-h-screen">

  <div class="max-w-7xl mx-auto px-6 py-10">
    <h1 class="text-5xl font-bold tracking-tight mb-10 flex items-center gap-3">
      🌅 Sunset Spots
    </h1>

    <div class="mb-8">
      <input id="location-input" type="text" placeholder="Search any city (e.g. Paris, Santorini, Tokyo)" 
             class="w-full max-w-xl bg-zinc-900 border border-white/20 rounded-3xl px-8 py-5 text-lg focus:outline-none">
      <button onclick="searchLocation()" 
              class="mt-4 md:mt-0 md:ml-3 bg-amber-500 hover:bg-amber-600 text-black px-10 py-5 rounded-3xl font-semibold">
        Search Location
      </button>
    </div>

    <button onclick="autoDetectAndShow()" 
            class="mb-10 px-6 py-3 bg-white text-black font-semibold rounded-2xl">
      📍 Use My Current Location
    </button>

    <div id="status" class="text-amber-400 mb-6"></div>

    <div id="results">
      <h2 id="location-name" class="text-3xl font-semibold mb-6"></h2>
      <div id="main-map" class="w-full h-96 bg-zinc-800 rounded-3xl mb-10"></div>
      <div id="spots-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </div>
  </div>

<script>
// Simple status message
function showStatus(msg, color = "text-amber-400") {
  document.getElementById('status').innerHTML = `<span class="${color}">${msg}</span>`;
}

// Rest of the code (same as before but with safety checks)
let userLat = null, userLng = null, mainMap = null;
let spotsDB = [ /* ... same 20 spots as in previous version ... */ ];

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return parseFloat((R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))).toFixed(1));
}

function getSunsetTime(lat, lng) {
  try {
    const times = SunCalc.getTimes(new Date(), lat, lng);
    return times.sunset.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  } catch(e) { return "—"; }
}

function initMap(id, lat, lng) {
  if (mainMap) mainMap.remove();
  mainMap = L.map(id).setView([lat, lng], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(mainMap);
}

async function searchLocation() {
  const query = document.getElementById('location-input').value.trim();
  if (!query) return showStatus("Please type a city name", "text-red-400");

  showStatus("Searching location...");
  
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
    const data = await res.json();
    
    if (data && data[0]) {
      userLat = parseFloat(data[0].lat);
      userLng = parseFloat(data[0].lon);
      document.getElementById('location-name').innerHTML = `Sunset spots near <span class="gradient-text">${query}</span>`;
      
      if (!mainMap) initMap('main-map', userLat, userLng);
      else mainMap.flyTo([userLat, userLng], 10);
      
      renderSpots();
      showStatus("");
    } else {
      showStatus("Location not found", "text-red-400");
    }
  } catch(e) {
    showStatus("Network error. Please check your internet.", "text-red-400");
  }
}

function autoDetectAndShow() {
  showStatus("Getting your location...");
  if (!navigator.geolocation) {
    showStatus("Geolocation not supported", "text-red-400");
    return;
  }

  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    document.getElementById('location-name').innerHTML = `Sunset spots near <span class="gradient-text">You</span>`;
    
    if (!mainMap) initMap('main-map', userLat, userLng);
    else mainMap.flyTo([userLat, userLng], 10);
    
    renderSpots();
    showStatus("");
  }, () => {
    showStatus("Location access denied. Please use the search bar above.", "text-red-400");
  });
}

function renderSpots() {
  if (!userLat || !userLng) return;
  
  const grid = document.getElementById('spots-grid');
  grid.innerHTML = '';

  // Simple rendering for now (you can expand later)
  spotsDB.forEach(spot => {
    const dist = haversine(userLat, userLng, spot.lat, spot.lng);
    if (dist > 300) return;

    const card = document.createElement('div');
    card.className = "bg-zinc-900 rounded-3xl p-6 border border-white/10";
    card.innerHTML = `
      <h3 class="text-xl font-semibold">${spot.name}</h3>
      <p class="text-zinc-400">${spot.city} • ${dist.toFixed(0)} km</p>
      <p class="text-amber-300 mt-2">Sunset ≈ ${getSunsetTime(spot.lat, spot.lng)}</p>
    `;
    grid.appendChild(card);
  });

  if (grid.innerHTML === '') {
    grid.innerHTML = `<p class="text-zinc-400">No nearby spots found within 300 km.</p>`;
  }
}

// Add a few spots for testing
spotsDB = [
  {id:1, name:"Griffith Observatory", lat:34.1184, lng:-118.3003, city:"Los Angeles"},
  {id:3, name:"Eiffel Tower", lat:48.8584, lng:2.2945, city:"Paris"},
  {id:9, name:"Santorini Caldera", lat:36.3932, lng:25.4615, city:"Santorini"},
  {id:14, name:"Sydney Opera House", lat:-33.8568, lng:151.2153, city:"Sydney"}
];

// Start the app
window.onload = () => {
  showStatus("App loaded. Click 'Use My Current Location' or search a city.");
  // Auto try location after 1 second
  setTimeout(() => {
    if (!userLat) autoDetectAndShow();
  }, 800);
};
</script>
</body>
</html>
