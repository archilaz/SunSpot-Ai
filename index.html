<!DOCTYPE html>
<html lang="en" class="bg-zinc-950 text-white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sunset Spots • Find Your Perfect View</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-text { background: linear-gradient(90deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .spot-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .spot-card:hover { transform: translateY(-12px); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4); }
    .nav-active { border-bottom: 3px solid #f59e0b; font-weight: 600; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <div class="max-w-7xl mx-auto px-6 py-10">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
      <h1 class="text-5xl font-bold tracking-tight flex items-center gap-3">
        🌅 <span>Sunset Spots</span>
      </h1>
      
      <div class="flex gap-3">
        <button onclick="switchTab('nearby')" id="btn-nearby"
                class="nav-active px-6 py-3 rounded-2xl hover:bg-white/10 transition">Nearby</button>
        <button onclick="switchTab('favorites')" id="btn-favorites"
                class="px-6 py-3 rounded-2xl hover:bg-white/10 transition">❤️ Favorites</button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="mb-10">
      <div class="flex gap-3 max-w-2xl">
        <input 
          id="location-input"
          type="text" 
          placeholder="Search any city or destination (e.g. Santorini, Banff, Tokyo...)"
          class="flex-1 bg-zinc-900 border border-white/10 rounded-3xl px-8 py-5 text-lg focus:outline-none focus:border-amber-500 transition"
          onkeypress="if(event.key === 'Enter') searchLocation()"
        />
        <button onclick="searchLocation()" 
                class="bg-amber-500 hover:bg-amber-600 text-black px-10 py-5 rounded-3xl font-semibold whitespace-nowrap">
          Search
        </button>
      </div>
    </div>

    <!-- Nearby Tab -->
    <div id="nearby-tab">
      <h2 id="location-name" class="text-3xl font-semibold mb-8"></h2>
      <div id="main-map" class="w-full h-96 rounded-3xl overflow-hidden mb-10 border border-white/10"></div>
      <div id="spots-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </div>

    <!-- Favorites Tab -->
    <div id="favorites-tab" class="hidden">
      <h2 class="text-3xl font-semibold mb-8 flex items-center gap-3">
        ❤️ Your Favorite Sunset Spots
      </h2>
      <div id="favorites-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      <div id="no-favorites" class="hidden text-center py-20 text-zinc-400 text-xl">
        You haven't saved any favorite spots yet.<br>
        <span class="text-sm block mt-2">Heart a spot to add it here ❤️</span>
      </div>
    </div>

    <!-- Add New Spot Modal -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
      <div class="bg-zinc-900 rounded-3xl p-8 max-w-md w-full mx-4">
        <h3 class="text-2xl font-semibold mb-6">Add Your Own Sunset Spot</h3>
        
        <div class="space-y-5">
          <input id="new-name" placeholder="Spot Name (e.g. My Rooftop)" 
                 class="w-full bg-zinc-800 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-amber-500">
          
          <div class="grid grid-cols-2 gap-4">
            <input id="new-lat" placeholder="Latitude" type="number" step="0.0001"
                   class="w-full bg-zinc-800 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-amber-500">
            <input id="new-lng" placeholder="Longitude" type="number" step="0.0001"
                   class="w-full bg-zinc-800 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-amber-500">
          </div>
          
          <input id="new-city" placeholder="City / Area" 
                 class="w-full bg-zinc-800 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-amber-500">
        </div>

        <div class="flex gap-4 mt-8">
          <button onclick="closeModal()" 
                  class="flex-1 py-4 border border-white/30 rounded-2xl font-medium">Cancel</button>
          <button onclick="addCustomSpot()" 
                  class="flex-1 py-4 bg-amber-500 hover:bg-amber-600 text-black font-semibold rounded-2xl">Add Spot</button>
        </div>
      </div>
    </div>

    <!-- Floating Action Button -->
    <button onclick="showAddModal()" 
            class="fixed bottom-8 right-8 bg-amber-500 hover:bg-amber-600 text-black w-16 h-16 rounded-full text-4xl shadow-2xl flex items-center justify-center transition shadow-amber-500/30">
      +
    </button>
  </div>

<script>
// ====================== DATA ======================
let userLat = null, userLng = null, currentLocationName = "You";
let mainMap = null;
let currentTab = 'nearby';

let favorites = JSON.parse(localStorage.getItem('sunspotsFavorites') || '[]');

let spotsDB = [
  {id:1, name:"Griffith Observatory", lat:34.1184, lng:-118.3003, city:"Los Angeles, USA"},
  {id:2, name:"Santa Monica Pier", lat:34.0101, lng:-118.4961, city:"Los Angeles, USA"},
  {id:3, name:"Eiffel Tower - Champ de Mars", lat:48.8584, lng:2.2945, city:"Paris, France"},
  {id:4, name:"Table Mountain Top", lat:-33.9629, lng:18.4098, city:"Cape Town, South Africa"},
  {id:5, name:"Victoria Peak Sky Terrace", lat:22.2764, lng:114.1581, city:"Hong Kong"},
  {id:6, name:"Dubai Desert Dune", lat:25.1972, lng:55.2744, city:"Dubai, UAE"},
  {id:7, name:"Amalfi Coast Viewpoint", lat:40.6340, lng:14.6028, city:"Positano, Italy"},
  {id:8, name:"Sugarloaf Mountain", lat:-22.9486, lng:-43.1564, city:"Rio de Janeiro, Brazil"},
  {id:9, name:"Santorini Caldera View", lat:36.3932, lng:25.4615, city:"Santorini, Greece"},
  {id:10, name:"Machu Picchu Sunrise/Sunset", lat:-13.1631, lng:-72.5450, city:"Cusco Region, Peru"},
  {id:11, name:"Banff Lake Louise", lat:51.4284, lng:-116.1778, city:"Banff, Canada"},
  {id:12, name:"Bali Uluwatu Temple", lat:-8.8296, lng:115.0853, city:"Uluwatu, Bali"},
  {id:13, name:"Marrakech rooftop", lat:31.6295, lng:-7.9811, city:"Marrakech, Morocco"},
  {id:14, name:"Sydney Opera House", lat:-33.8568, lng:151.2153, city:"Sydney, Australia"},
  {id:15, name:"Hawaii - Waikiki Beach", lat:21.2767, lng:-157.8234, city:"Honolulu, Hawaii"},
  {id:16, name:"Reykjavik Hallgrímskirkja", lat:64.1410, lng:-21.9266, city:"Reykjavik, Iceland"},
  {id:17, name:"Queenstown Skyline Gondola", lat:-45.0318, lng:168.6624, city:"Queenstown, New Zealand"},
  {id:18, name:"Zhangjiajie Glass Bridge", lat:29.3128, lng:110.4425, city:"Zhangjiajie, China"},
  {id:19, name:"Cape Point", lat:-34.3567, lng:18.4972, city:"Cape Town, South Africa"},
  {id:20, name:"Acropolis of Athens", lat:37.9715, lng:23.7257, city:"Athens, Greece"}
];

// ====================== UTILITIES ======================
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return parseFloat((R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))).toFixed(1));
}

function getSunsetTime(lat, lng) {
  const times = SunCalc.getTimes(new Date(), lat, lng);
  return times.sunset.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function initMap(id, lat, lng) {
  if (mainMap) mainMap.remove();
  mainMap = L.map(id).setView([lat, lng], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(mainMap);
  return mainMap;
}

// ====================== RENDER FUNCTIONS ======================
function renderSpots(centerLat, centerLng, locationName) {
  const filtered = spotsDB
    .map(s => ({
      ...s,
      distance: haversine(centerLat, centerLng, s.lat, s.lng),
      sunsetTime: getSunsetTime(s.lat, s.lng)
    }))
    .filter(s => s.distance <= 200)
    .sort((a, b) => a.distance - b.distance);

  const grid = document.getElementById('spots-grid');
  grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="col-span-3 text-center py-20 text-zinc-400">No spots found nearby.</div>`;
    return;
  }

  filtered.forEach(spot => renderSpotCard(spot, grid, centerLat, centerLng));
}

function renderFavorites() {
  const grid = document.getElementById('favorites-grid');
  grid.innerHTML = '';
  const noFav = document.getElementById('no-favorites');

  if (favorites.length === 0) {
    noFav.classList.remove('hidden');
    return;
  }
  noFav.classList.add('hidden');

  favorites.forEach(spot => {
    const cardSpot = {...spot, distance: 0, sunsetTime: getSunsetTime(spot.lat, spot.lng)};
    renderSpotCard(cardSpot, grid, null, null, true);
  });
}

function renderSpotCard(spot, container, centerLat = null, centerLng = null, isFavoriteView = false) {
  const isFav = favorites.some(f => f.id === spot.id);
  const distanceHTML = centerLat ? `<div class="absolute bottom-5 left-5 bg-black/70 px-5 py-1.5 rounded-3xl text-xs">${spot.distance} km</div>` : '';

  const html = `
    <div class="spot-card bg-zinc-900 rounded-3xl overflow-hidden border border-white/10">
      <div class="relative h-80">
        <img src="https://picsum.photos/id/${(spot.id % 100) + 100}/800/600" class="w-full h-full object-cover" alt="${spot.name}">
        ${distanceHTML}
      </div>
      <div class="p-7">
        <div class="flex justify-between">
          <div>
            <h3 class="text-2xl font-semibold">${spot.name}</h3>
            <p class="text-zinc-400 text-sm mt-1">${spot.city}</p>
          </div>
          <div class="text-right">
            <div class="text-amber-400 text-xs tracking-widest">SUNSET</div>
            <div class="text-3xl font-light text-amber-200">${spot.sunsetTime}</div>
          </div>
        </div>
        <div class="mt-8 flex gap-3">
          ${centerLat ? `<button onclick="getDirections(${spot.lat},${spot.lng});event.stopImmediatePropagation()" 
                          class="flex-1 py-4 bg-white text-zinc-950 font-semibold rounded-2xl">🧭 Directions</button>` : ''}
          <button onclick="toggleFavorite(${spot.id});event.stopImmediatePropagation()" 
                  class="px-8 py-4 border border-white/30 rounded-2xl text-3xl ${isFav ? 'text-red-500' : 'text-white/40'}">
            ❤️
          </button>
        </div>
      </div>
    </div>`;
  
  container.innerHTML += html;
}

// ====================== ACTIONS ======================
function getDirections(lat, lng) {
  if (!userLat || !userLng) {
    alert("Set your current location first using the search bar or 'Use My Location'.");
    return;
  }
  window.open(`https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLng}&destination=${lat},${lng}`, '_blank');
}

function toggleFavorite(id) {
  const spot = spotsDB.find(s => s.id === id) || favorites.find(f => f.id === id);
  if (!spot) return;

  const index = favorites.findIndex(f => f.id === id);
  if (index > -1) favorites.splice(index, 1);
  else favorites.push(spot);

  localStorage.setItem('sunspotsFavorites', JSON.stringify(favorites));
  
  // Refresh current view
  if (currentTab === 'nearby' && userLat) renderSpots(userLat, userLng, currentLocationName);
  else if (currentTab === 'favorites') renderFavorites();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('nearby-tab').classList.toggle('hidden', tab !== 'nearby');
  document.getElementById('favorites-tab').classList.toggle('hidden', tab !== 'favorites');

  document.getElementById('btn-nearby').classList.toggle('nav-active', tab === 'nearby');
  document.getElementById('btn-favorites').classList.toggle('nav-active', tab === 'favorites');

  if (tab === 'favorites') renderFavorites();
}

async function searchLocation() {
  const query = document.getElementById('location-input').value.trim();
  if (!query) return;

  document.getElementById('nearby-tab').classList.remove('hidden');
  switchTab('nearby');

  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
    const data = await res.json();

    if (data && data.length > 0) {
      userLat = parseFloat(data[0].lat);
      userLng = parseFloat(data[0].lon);
      currentLocationName = data[0].display_name.split(',')[0] || query;

      document.getElementById('location-name').innerHTML = 
        `Sunset spots near <span class="gradient-text">${currentLocationName}</span>`;

      if (!mainMap) mainMap = initMap('main-map', userLat, userLng);
      else mainMap.flyTo([userLat, userLng], 10);

      renderSpots(userLat, userLng, currentLocationName);
    } else {
      alert("Location not found. Try a different name.");
    }
  } catch (e) {
    alert("Search failed. Please check your internet connection.");
  }
}

function autoDetectAndShow() {
  if (!navigator.geolocation) return alert("Geolocation not supported.");
  
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    currentLocationName = "You";
    document.getElementById('location-name').innerHTML = `Sunset spots near <span class="gradient-text">You</span>`;
    
    if (!mainMap) mainMap = initMap('main-map', userLat, userLng);
    else mainMap.flyTo([userLat, userLng], 10);

    switchTab('nearby');
    renderSpots(userLat, userLng, currentLocationName);
  }, () => alert("Please allow location access or search manually."));
}

// ====================== CUSTOM SPOT ======================
function showAddModal() {
  document.getElementById('add-modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('add-modal').classList.add('hidden');
  document.getElementById('new-name').value = '';
  document.getElementById('new-lat').value = '';
  document.getElementById('new-lng').value = '';
  document.getElementById('new-city').value = '';
}

function addCustomSpot() {
  const name = document.getElementById('new-name').value.trim();
  const lat = parseFloat(document.getElementById('new-lat').value);
  const lng = parseFloat(document.getElementById('new-lng').value);
  const city = document.getElementById('new-city').value.trim() || "Custom Location";

  if (!name || isNaN(lat) || isNaN(lng)) {
    alert("Please fill in name, latitude, and longitude.");
    return;
  }

  const newId = Math.max(0, ...spotsDB.map(s => s.id)) + 1;
  const newSpot = { id: newId, name, lat, lng, city };

  spotsDB.push(newSpot);
  toggleFavorite(newId); // automatically favorite the new spot

  closeModal();
  alert("Your sunset spot has been added and saved to favorites!");

  // Refresh current view
  if (currentTab === 'nearby' && userLat) renderSpots(userLat, userLng, currentLocationName);
  else renderFavorites();
}

// ====================== INIT ======================
window.onload = () => {
  autoDetectAndShow();
};
</script>
</body>
</html>
